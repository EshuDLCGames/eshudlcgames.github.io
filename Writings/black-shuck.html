<template id="src"><div class="epigraph">
<p><em>There was an accident, and someone died,</em> a young boy thought
as he looked out the back window.</p>
</div>
<section id="one-the-road" class="level2">
<h2>One: The Road</h2>
<p>On a nameless road swallowed by fog, under a starless sky the color
of rotten plums, the high beams of the black Ford Explorer did little to
light the way for the two travelers inside. They only pointed at the
yellow and white lines on the blacktop.</p>
<p>“Thank God up high for those lines,” Terrie said, in his <em>hey,
let’s have a conversation</em> voice.</p>
<p>Sissy ignored him.</p>
<p>He glanced over at his wife. Cecelia, though nobody had called her
that since grade school, was buried alive in her newest acquisition, a
collection of short stories and poems. Sissy loved ghost stories. She
owned dozens of what Terrie, when he was teasing, called her “ghost
books”: monsters and zombies, angels and demons. Her fascination with
the undead had claimed every inch of shelf space in their living room.
Terrie was a nonfiction man. Politics, history, anything that started
with <em>The Life of</em> or <em>The True Story Behind</em>. Give him
Michael Moore any day.</p>
<p>This latest book gave him the chills. It was maroon, almost the color
of dried blood. There were no words on the front cover, only a shattered
skull embroidered in gold thread, its pieces held together by thin gold
strings like a marionette that had been broken into a dozen pieces and
strung back together by someone in a hurry. The only text was on the
spine, in large black letters: <em>Pages for the Dead and
Dying.</em></p>
<p>Terrie hated that book, and he couldn’t have told you why. It just
wasn’t right. It had come in the mail the day before they left, and
she’d been reading it ever since. He didn’t understand why it had to be
the hardcover. He’d bought her a Kindle last Christmas, and she’d acted
like it was the most thoughtful gift he’d ever given her. She still
ordered paper books. She still yelled at him for not recycling his beer
cans. <em>Want to save the world, Sis? Stop killing trees because you
like how they feel.</em></p>
<p>That one made him laugh out loud. Sissy didn’t notice. He pulled a
big, clownish frown at her, and that made him laugh again. <em>I’m
hilarious,</em> he thought, and puffed out his chest like a man
accepting the Medal of Honor. He looked over at his wife.</p>
<p>Nothing.</p>
<p>She’d read that book for most of the drive. For the last two hours,
on this nameless road, she’d fallen into something close to a
trance.</p>
<p>He wished she would put it away and talk to him. He wanted to stuff
the thing under the seat like the monster in a children’s story. There
were two things Terrie loved about road trips, long conversations and
the endless roll of the landscape, and tonight he was getting neither.
The sky hung over them like a starless indigo blanket, like a bad omen,
and the only conversation was Eddie Vedder on the radio singing “Do the
Evolution.”</p>
<p>Terrie sang along with the chorus, right on the beat and nowhere near
the key, loud enough to rattle the dashboard.</p>
<p>Sissy, a thousand miles away in her book, winced. Terrie saw it and
sang louder. Her fist shot out and caught him in the shoulder.</p>
<p>“OW!” He howled, much louder than necessary. “What was that for?”</p>
<p>He sounded like a hurt, confused little kid. Without taking her eyes
off the page, Sissy blew him a kiss. From where he sat, though, it
looked like the kiss was meant for the book. <em>Silly,</em> he told
himself, and shook the thought out of his head.</p>
<p>He’d rather have had the conversation, but he did love watching her
read. They’d both been big readers when they met, and they used to spend
whole afternoons reading out loud to each other. If you’d asked him
about a single story she read him in those days, he couldn’t have told
you, not to save his life. He was never really listening. He was
watching her.</p>
<p>She was beautiful. Her skin was caramel with a touch of cream, and
her eyes were the gray of granite, glittering under the little reading
light. She never wore lipstick, and her dark lips moved softly as she
read. Her hair was liquid midnight, thick and wavy, falling well past
her shoulders and over the curve of the breasts that rose and fell with
every breath. <em>God, she’s lovely.</em></p>
<p>Terrie was well on his way to some very unholy thoughts when
something caught the corner of his eye.</p>
<p>Something in the road.</p>
<p>It was huge. It took up half the lane. Terrie swerved onto the
shoulder to miss it head-on, lifting off the gas to keep control and
banking gently to the right. The truck leaned hard. Sissy’s book flew
out of her hands and her head bounced off the window. The right tires
hit gravel and threw up a furious cloud of dust. Then they were past
it.</p>
<p><em>A bull,</em> Terrie told himself. <em>It had to be a bull.
Wandered off one of the farms out here.</em></p>
<p>Sissy was furious. Her head hurt, and worse, she’d lost her page.
<em>This could be bad,</em> Terrie thought, as she started punching his
arm.</p>
<p>“What the FUCK was that, Terr?” Her gray eyes blazed. “You almost
knocked me out, you crazy MOFO!”</p>
<p>She took a breath. She pressed the back of her head against the
headrest to ease the pain shooting through her temples. “Was there
something in the road? Or did you doze off?” She twisted around to look
out the back window for whatever it was.</p>
<p>She saw nothing.</p>
<p>“Well?”</p>
<p>Terrie checked the rearview. Nothing back there but black. “I don’t
know what it was. A bull or something. Good God, Sis, it took up half
the road. I’m sorry I had to swerve.” He gave her a careful smile. “It
was the shoulder of the bull or the shoulder of the road, sweet cakes.”
He snickered and winked. Then the smile faded. “No, seriously, babe. You
okay?”</p>
<p>Sissy rubbed her head and looked at her fingers. No blood. “I’m
okay,” she said, matter-of-fact. “Well. Now you’ve got my attention.”
She picked the book up off the floor, found her page, and slipped a
bookmark in.</p>
<p>Terrie’s eyes were glued to the road, and his heart was still racing.
She leaned over and kissed him on the cheek, with the softest lips he
had ever known. He turned to her, his wife of five years, completely
bewildered. “What was that for?”</p>
<p>“The way I see it,” Sissy said, “you just saved both our lives. I
wanted you to know I love you.”</p>
<p>Terrie laughed. “Well, shit. I need to swerve more often.”</p>
<p>They both laughed. For a little while it felt like the strangeness of
the trip was behind them as they rolled on down the lonely road. They
relaxed. They expected nothing more.</p>
<p>They were wrong.</p>
</section>
<section id="two-the-accident" class="level2">
<h2>Two: The Accident</h2>
<p>About forty-five minutes after the near miss, the fog that had been
swallowing the road began to lift. The scenery stayed the same seamless
nothing. The fog was gone, but a thin, eerie haze still clung to the
asphalt, and with no streetlights, the dark took everything past
forty-five feet. Between the bull and driving blind into the unknown,
Terrie eased down to a smooth sixty-five.</p>
<p>A bad feeling washed over Sissy like a draft from an open door. Her
arms broke out in goosebumps. <em>The cold creeps,</em> her Grams used
to call it. Thinking of Grams warmed her, and the dread passed through
and out of her like a breeze. <em>We’re fine,</em> she told herself.
<em>This isn’t one of your ghost stories, girl. Relax.</em></p>
<p>They drove on into the haze.</p>
<p>Terrie saw them first: two red lights far ahead, lost in the haze,
like a demon’s eyes peering out of a dark closet. He nudged her. “Hey,
look, babe. Looks like we’re not alone anymore.”</p>
<p>Sissy looked at him, then down the road, and saw the two red lights.
She opened her mouth to answer, and the lights went out. Not faded.
Gone. They vanished into the haze so suddenly that it frightened
her.</p>
<p>Terrie saw it too. They turned to each other and said it at the same
moment: “Did you see that?”</p>
<p>The chill came back to Sissy’s skin, and every hair on her arms stood
at attention. Terrie was afraid, and in the same moment he remembered
the bull in the road. He realized he couldn’t remember whether it had
red eyes.</p>
<p>A little farther on they saw another pair of red lights, low and
steady at the side of the road, and these ones weren’t going anywhere.
As they got closer, they could make out a car on the shoulder.</p>
<p><em>There’s been an accident,</em> Sissy thought, and the Good
Samaritan in her took over. “Terrie, pull over! Somebody might be
hurt.”</p>
<p>It was a decision that would cost her the love of her life.</p>
<p>Terrie was terrified, and he couldn’t have said why. His stomach
filled with nervous butterflies. He pulled over anyway. Those red eyes
in the haze were still burned into his mind like the afterimage of a
camera flash. He blinked hard to clear them, so he could think about
what was in front of him.</p>
<p>He stopped about fifteen feet behind the wreck.</p>
<p>It had been a car once. A gold Ford Focus, maybe a 2010. His sister
drove the same model, in blue. Right now it was nothing but a ball of
metal. It looked like it had taken a far worse beating than a slide off
the road. The body was twisted and peeled open in every direction. As
Terrie walked up to it, he could see that the windows were blown out and
the doors had been torn clean off. He looked up and down the road and
found no sign of what had happened. No skid marks. Nothing. His eyes
went back to the carcass.</p>
<p>The dome light was still on, but he couldn’t see anyone inside. The
only sound was the car’s chime, <em>ding, ding, ding</em>, which meant
the keys were probably still in the ignition.</p>
<p>“Hello?”</p>
<p>Nothing.</p>
<p>“Hey! Is anybody in there? I’m here to help. My wife’s calling
911.”</p>
<p>No answer. Terrie didn’t like this at all. Every part of him wanted
to turn around and run back to the truck. He didn’t. He walked around
the wreck. The taillight was smashed to pieces, as if a crazy ex had
gone at it with a sledgehammer. Something sticky had pooled under the
car, and he stepped in it, and he didn’t dare touch it with his hands.
The back door was gone completely.</p>
<p>“Dear God,” he said under his breath.</p>
<p>What Terrie Smallgood saw in that back seat, he would take to his
grave and beyond. Flesh and bone and cushion and metal, tossed together
like a salad, with a generous dressing of blood.</p>
<p>Terrie vomited.</p>
</section>
<section id="three-eyes" class="level2">
<h2>Three: Eyes</h2>
<p>There was a sound on the far side of the car. No living man had ever
heard a sound like it, and it burned fear straight into Terrie’s
bones.</p>
<p>It was a low groan tangled up with a growl so deep he felt it through
the soles of his shoes and in the cavity of his chest. Then came a howl,
twisted and wrong, like a hundred dead wolves howling together through
rotten throats. Every hair on his body stood up. His skin crawled. His
heart dropped, and he felt himself shrink inside his clothes.</p>
<p>There were no footsteps. No snapping twigs, no rustle in the brush.
Nothing. And yet Terrie knew, the way you know a stove is hot, that when
he looked over the car and past the ditch where it lay half-buried, he
would see it: an enormous shadow with deep, murderous red eyes.</p>
<p>All he wanted was to curl up in a ball and hide from the world. But
it would find him anyway, there behind the wreck, curled up like a baby
in the womb, or a meatball dropped on the carpet. Then there would be
two works of abstract violence lying on the side of the road instead of
one: the car, and Terrie, a tattered mess of cloth and meat.</p>
<p>Fear had nailed him to the spot.</p>
<p>It growled again. It sounded like the noise alligators make when they
rumble under the water and the surface shivers. Terrie couldn’t think of
the word for it. It sounded bad. This time he found the nerve to lift
his head and look across the crumpled roof.</p>
<p>There it stood. A shadow made flesh.</p>
<p>It was eight, maybe ten feet tall, built like a bear but with the
head of a bulldog. Its enormous mouth streamed blood. Its jaws worked in
slow circles, like a cow chewing cud, and something hung slack from the
right corner of its mouth: the top half of a young woman. Her age, her
skin, everything about her was lost under the blood. She was red from
head to waist. Except her eyes. Her eyes were bright white, and they
stared at nothing.</p>
<p>The beast lifted its head and looked at Terrie and kept chewing. It
didn’t move. It seemed to be deciding what to do next, holding the girl
the way a puppy holds a new chew toy. And they stood there, locked in
the strangest staring contest of Terrie’s life.</p>
</section>
<section id="four-just-one-step" class="level2">
<h2>Four: Just One Step</h2>
<p>It looked at him with almost no interest at all. Its red eyes burned
through him to his soul. But it didn’t come for him. It watched, and it
chewed, like a puppy with a ham bone. Every so often the torso started
to slip from its great bulldog jowls, and the creature jerked its head
back to get a better grip on its prize before it hit the ground. The
girl swung, limp. She didn’t react to anything.</p>
<p>Terrie stood frozen. He had already accepted that he was going to end
up the same way. The same as the nameless flesh in that monster’s
teeth.</p>
<p><em>Is this real?</em> he thought. <em>This isn’t real,</em> he lied.
<em>This can’t be real.</em> The lie went around and around in his head,
and he wanted it to stop. He wanted everything to stop. He wasn’t built
for this. He wasn’t creative, he wasn’t imaginative; he was a
by-the-numbers, by-the-facts kind of guy. This didn’t make sense, so it
didn’t belong in his world.</p>
<p>Something in his mind snapped.</p>
<p>He wanted to close his eyes and count to ten, and when he opened them
it would be gone, and he’d be back in the real world, a world without
giant man-eating bear-dogs prowling the roads at night. But he knew that
if he closed his eyes, he wouldn’t see it vault the car. He wouldn’t see
it take his arm and tear it off like a chicken wing, then open his belly
with one swipe of those claws and lap up his insides like a starving
stray at a bowl of canned food.</p>
<p>None of that happened. Not yet.</p>
<p>And while Terrie stood there cataloguing the ways he was going to
die, one word hit him like a slap.</p>
<p><em>Sissy.</em></p>
<p>She was still in the truck. If he took much longer, she would come
looking. She would see. And then… no. He wouldn’t let that happen. If he
yelled to her, he might set the thing off. Right now it had its head
down, worrying at a flap of skin on the torso, trying to peel it. For
the moment it seemed to have forgotten him completely.</p>
<p>His thoughts began to slow down and line up. A plan was forming.</p>
<p>Then the world shattered.</p>
<p><em>BEEEEEEP!</em></p>
<p>The truck’s horn blared across the empty road. Terrie’s heart fell
through the floor. And then it got worse.</p>
<p>“TERR! TERR! Honey, are you okay? You’re just standing there like
you’ve seen a…”</p>
<p>He turned and saw, to his horror, that she was opening her door to
get out.</p>
<p>Terrie screamed at his wife in a way he never had before and never
would again. “GET THE FUCK BACK IN THE TRUCK!”</p>
<p>The words were still leaving his mouth when he ran. He’d run track as
a kid, so he knew how to dig deep, and it had been twenty years since
his last meet, but the way he moved that night would have left his
younger self in the dust.</p>
<p>The creature did nothing. It just crushed, and tore, and chewed.</p>
</section>
<section id="five-back-on-the-road" class="level2">
<h2>Five: Back on the Road</h2>
<p>When Terrie reached the driver’s door, his hands were shaking too
badly to open it.</p>
<p>Sissy stared at him, scared and confused. She had never seen him like
this. Terrie didn’t scare easily. He was the man with a plan, or at
least an explanation. Even during the pandemic, when half the people she
knew, herself included, had started coming apart into conspiracy
theories, Terrie had kept his head. Now he couldn’t work a door
handle.</p>
<p>She leaned across and popped it open for him, and she saw the relief
flood his face. He flung the door wide so hard she thought it might come
off its hinges, threw himself into the seat, slammed it shut, and turned
the key.</p>
<p>The engine was already running. The starter shrieked, a jarring metal
grind like gears locking teeth. Sissy squeezed her eyes shut.</p>
<p>“CALM THE FUCK DOWN! Shit, what is wrong with you?”</p>
<p>He didn’t answer, but he seemed to realize the truck was on. He
dropped it into drive and stood on the gas. They were half on the road
and half off. The right tires bit, spat gravel, and chirped. The back
end fishtailed. Sissy looked at Terrie and saw that his eyes were
somewhere far away, and then he had control, and they were gone, leaving
only dust and two black streaks on the road behind them.</p>
<p>As they tore away, Sissy saw something at the side of the road: a
hulking shape, like a shadow standing up. It reminded her of the Balrog
from <em>The Lord of the Rings</em>, only smaller, and made of smoke
with no fire in it. <em>Maybe it’s the Balrog’s dog,</em> she thought.
<em>He had that fire whip for something, right?</em></p>
<p>The truck swerved, and she snapped back into the world.</p>
<p>The thing’s head came up. Its brilliant red eyes flickered ice blue
for an instant, then red again.</p>
<p>Then came the howl.</p>
<p>Imagine an air-raid siren braided together with the howls of endless
wolves, as if every dog that had ever died were howling at once in
greedy anticipation. The sound moved through the truck like a pressure
wave, and when it was gone, all Sissy could hear was ringing. She tried
to say something and couldn’t hear her own voice. She looked at Terrie
and saw blood running from his ears. She touched her own and felt
something wet and sticky.</p>
<p>Terrie hadn’t flinched. He hadn’t closed his eyes or swerved. His
eyes were locked on the road ahead like a machine’s.</p>
<p>As the ringing faded, Sissy tried to put it together. What did she
actually know? Terrie had seen something at the side of the road. It was
almost certainly the same thing that had just blown out their eardrums,
and it had almost certainly caused the wreck they’d stopped for. What
<em>was</em> it? Some kind of bear, or bulldog, the size of a
minivan.</p>
<p><em>A Black Shuck?</em> The hellhound of the old English stories. The
black dog that walks the lonely roads at night, with eyes like coals.
<em>Is that even possible?</em></p>
<p>She glanced at the side mirror and saw two glowing red lights.
No. Not lights. Eyes.</p>
<p>She twisted around and looked out the back window, and there they
were, clear as day. Two huge eyes glowing blood red, maybe half a
football field behind them.</p>
<p>Sissy screamed. It wasn’t the eyes alone. It was what they were set
in. The eyes were getting closer, and as they did, the face that held
them came clear: part bulldog, part Cane Corso, its heavy jowls soaked
in blood and flapping in the wind, its body only an outline in the mist
it shoved aside as it ran. It was as big as the truck. It ran with an
unnatural, impossible speed.</p>
<p>It was catching up.</p>
<p>The thought exploded in her head, and she screamed again. She turned
to Terrie, and the words came out without her deciding to say them.
“It’s following us. What the fuck is that thing, Terrie?”</p>
<p>Terrie said nothing. His eyes stayed on the road.</p>
<p>“TERRIE! SAY SOMETHING!”</p>
<p>Nothing.</p>
<p>“<em>Terrie!</em>” Frustration and dread, mixed together. He had to
snap out of it, and he had to do it now. “You’d better fucking answer
me! What is that thing behind us?” She looked back without meaning to.
It was closer. Now she was begging. “Terrie, please. Please answer me.
Please say something. Anything. I…”</p>
<p>When Terrie spoke, his voice was distant and cold, like a man calling
a golf game with nothing on the line.</p>
<p>“It killed her. It was chewing her like a toy. It must have run them
off the road and then killed them.” Terrified and perfectly calm, he
went on. “And it’s going to do the same thing to us.”</p>
<p>He turned to her. He was crying.</p>
<p>“I’m sorry.”</p>
<p>For a moment they just looked at each other, speeding down an
unmarked highway under a starless, moonless sky, with a crimson-eyed
predator running them down.</p>
</section>
<section id="six-lovers" class="level2">
<h2>Six: Lovers</h2>
<p><em>Their love was true, and they died knowing it.</em></p>
<p>Sissy looked out the back window again. It was right on them, less
than five feet away. Its fangs shone white as a full moon, the only
solid thing on the shadow running behind them: a glowing white mouth on
a shapeless monster, chasing them down an empty road. The alabaster
fangs snapped and snarled at their bumper.</p>
<p>It was going to hit them. She threw her arm across Terrie’s chest and
braced.</p>
<p><em>IMPACT.</em></p>
<p>The Shuck had dropped its head like a bull and rammed the bumper, and
the rear wheels left the road. Plastic and metal snapped and groaned.
The back window burst. For a moment Sissy felt weightless, and then the
rear tires slammed back down with a thud. The truck slewed, and Terrie
lost it for a second. He threw the truck into four-wheel drive, stood on
the gas and wrestled it back onto the road.</p>
<p>While he fought for control, Sissy felt something take hold of the
back of the truck. She looked. The beast had its teeth sunk in the
bumper and was dragging them toward the side of the road, keeping pace
the whole time. <em>Why doesn’t it just stop?</em> she thought. It could
plant its feet with its jaws locked on that bumper and tear the back
half of the truck off. That would wreck them. But it seemed set on
getting them to the side of the road. Terrie swerved back and forth to
shake it, and she watched them creep closer and closer to the edge
anyway. It was like a fisherman reeling in a catch without snapping the
line.</p>
<p>That gave her an idea. “Swerve hard to the middle! Make it let
go!”</p>
<p>Terrie gave a little slack toward the shoulder, then cut the wheel
hard the other way. The truck lurched forward, and Sissy felt the bumper
rip away. Terrie got control back, and they started to pull ahead.</p>
<p>Through what was left of the back window, Sissy watched the beast
shake its head in frustration. It bit down and snapped the bumper in
half and let out another bone-shaking howl.</p>
<p>The break didn’t last. Within seconds it was running again, and this
time it ran with purpose. It galloped at a speed no animal of this world
could reach. It moved like fear on the wind: a giant, starving beast
with eyes like cursed suns at the bottom of bottomless pits. She watched
it close the gap, a suggestion of a shape plowing through the mist,
nothing solid about it but the crimson eyes and the ghostly blue teeth
that glowed brighter and brighter, with excitement or with hunger.</p>
<p>Dear God, it was beside Terrie’s window. Its eyes were fixed on
him.</p>
<p>She watched the fear take him over. Every muscle in his body locked
tight. His brown knuckles went pale on the wheel. His foot tried to push
the gas pedal through the floor, as if he could will the truck faster.
It didn’t help. The red of its eyes shone through his window, and there
was nothing between her and the beast but her husband’s beautiful brown
skin.</p>
<p><em>Look at him,</em> she thought, lost in an endless instant of
panic and adrenaline and something sweet underneath. It all hit her at
once, and she remembered the man she had married. He was the best man
she could have hoped for. Not the most exciting, not the strongest or
the fittest, but when the pressure came down, he was unbreakable. He was
shy and terrible in crowds, but he would stand up for what he believed
in to the very end. Some people thought he was cold. He wasn’t cold. He
was calculating. If he ran the numbers and you weren’t worth his time,
he was done wasting it on you. She wished she could let go of people the
way he could, but she was loyal to a fault. It worked for them, because
he paid her loyalty back in kind. She knew he valued her, and she valued
him more than words could hold. Right now he was fighting for her as
much as for himself. She could see it in his eyes. He would do whatever
it took to get them out of this, and if anyone could, it was him.</p>
<p>Terrie pushed the gas with everything he had and gripped the wheel as
if his wife’s life depended on it, because it did. He would drive like
he had never driven before. He would get them out of this nightmare. The
fog pressed against the windshield, but somehow he could feel the road,
and he drove like a bat out of hell.</p>
<p>He’d shaken it loose once. <em>But now…</em></p>
<p>A faint blue light was filling the rearview mirror. Before he could
react, the thing was beside them again, matching their speed exactly.
There was no sound. No claws tearing up the pavement, no rush of wind as
it pressed forward. Nothing. As if it wasn’t really there.</p>
<p>It dropped its head and drove its shoulder into the side of the
truck.</p>
<p>Terrie’s window exploded, spraying glass across the cab. He barely
got his head turned and his hand up to cover his eyes. His palm, his
forearm and the side of his face were shredded. He could feel the glass
in his hand. He didn’t have time to care. He gripped the wheel tighter,
blood pouring from his palm and running from cuts all down his left
side, and pulled the truck straight without ever taking his eyes off the
road. He ignored the pain screaming at him.</p>
<p><em>Sissy was right,</em> he thought. <em>It wants us off the
road.</em></p>
<p>Another hit pushed them farther over. Hit after hit, they drifted.
The beast wasn’t using its full strength. It was more like a violent
nudge, over and over, steering them toward the black shoulder and
whatever was past it.</p>
<p>Terrie looked past the shoulder and saw nothing. But it was a
<em>something</em> kind of nothing. The empty dark beyond the road was
brimming with malice. With hunger. If they crossed into it, they would
be meat for the feast.</p>
<p>“No,” Terrie said, in the same instant that he thought it.</p>
<p>He looked over at the beast running beside him, its flickering red
eyes locked on his. “Brace yourself,” he told Sissy. And he smiled.</p>
<p>As the beast leaned in for another shove, Terrie jerked the truck
away from it. The beast hadn’t expected that. The tires grabbed the very
edge of the shoulder, inches from oblivion. The glass in his palm drove
deeper, and blood ran down the wheel. The creature saw its prey
teetering at the point of no return and lunged after it, sloppy with
excitement. Before it could recover, Terrie whipped the wheel back
toward it, to ram it.</p>
<p>They both braced for the impact.</p>
<p>And to their utter amazement, they slid straight through it, as if it
were smoke.</p>
<p>For a moment the beast’s ghastly head was inside the truck with them,
passing through the two of them, and its eyes seemed to turn inward to
watch them as they went by. Two red orbs drifted through the front seat
and out through Sissy’s window. Outside, the beast let out a grisly,
furious howl and kept running.</p>
<p>Before Terrie could make any sense of it, it was on Sissy’s side, its
face right outside her window. It rammed its face into her door. The
glass blew inward in a hail of tiny shards that covered both their laps.
Terrie saw glass caught in her thick, wavy hair and cuts across her
face. Sissy, who was never anything but calm, screamed in terror. The
thing slammed her door again and again, deliberate. It seemed to have
given up on running them off the road. Now it just wanted to pull one of
them out. Terrie could see its bright blue mouth snapping at her
door.</p>
<p>Time stopped.</p>
<p>Terrie saw Sissy, torn in half, lying on top of a mound of corpses,
and every one of them had his face, and every one was shredded beyond
belief. Four dog-like beasts, smaller than the big one, had their faces
buried in the mounds of his bodies, tearing and ripping and feeding. And
the big one, the one that had killed him a thousand times, stood under
an unearthly sky with four moons: two silver, one red, one orange. The
red one and one of the silver ones were enormous, dwarfing the others,
almost planets themselves. He knew, with complete certainty, that he was
looking at their future.</p>
<p>He would not let her die. Not without a fight.</p>
<p>Her door was about to give. He didn’t dare hit the brakes. So he made
a decision.</p>
<p>“Under the seat! Black bag! I’m sorry I didn’t tell you. I knew you’d
kill me.”</p>
<p>He swung the wheel hard right. The beast was forced into its mist
form just as its jaws slammed shut. They felt the air those jaws pushed,
and they smelled its breath, and it was rank: rotten meat, soup left out
to fester, and a breath of sulfur. It hung in the cab as the thing
passed through. Its mouth was as big as a great white shark’s, with
three rings of bright blue teeth that seemed to hum with
anticipation.</p>
<p>It came back together on Terrie’s side. It roared in fury. It had
almost had its meal.</p>
<p>It rammed its head into Terrie’s wheel so hard the truck jumped four
feet into the air. When they came down, something cracked underneath
them. It was a miracle they were still moving, and Terrie knew it
wouldn’t last.</p>
<p>Blue-white fangs punched through his door and into his arm and his
side. All feeling left the left side of his body. He didn’t scream. He
didn’t even flinch. He turned to Sissy, looked her dead in the eye, and
smiled, and said the last thing he would ever say.</p>
<p>“I fucking love you, baby.”</p>
</section>
<section id="seven-crossing-the-stream" class="level2">
<h2>Seven: Crossing the Stream</h2>
<p>It all happened in an instant. One moment he was there. The next he
was gone, pulled out into the dark.</p>
<p>Then Sissy’s world was spinning. Her head struck something, and
everything went black.</p>
<p>When she woke, there was only darkness. Somewhere ahead of her, she
heard Terrie’s voice.</p>
<p>“Sissy… Sissy… please help me.”</p>
<p>He sounded weak and hoarse. Every part of her hurt, but she crawled,
and then she dragged herself to her feet, and she walked into the
endless night toward the sound of his voice.</p>
<p>The darkness was so thick she could almost swim in it. It was like
walking through a fog so dense you could feel it slide down your throat
like sludge when you breathed. <em>This is what the smoke of Mount Doom
must feel like,</em> she thought. It smelled of sulfur.</p>
<p>She kept going, calling his name. His voice was growing weaker, but
she was getting closer. She pushed her fingers through the dark ahead of
her as she walked, and then she touched something. It was smooth and
cool. Then she heard him, right in front of her.</p>
<p>The darkness thinned, a little, and she could see him.</p>
<p>He was naked and covered in blood. It seemed to be coming from his
left hand, or from what she could see of it. He was raised up off the
ground, hanging by that arm, which disappeared into the haze around
them, as if he’d been half crucified. Sissy threw her arms around him
and pulled him close. She tried to lift him to his feet, and he
groaned.</p>
<p>“Can you walk?”</p>
<p>Terrie shook his head.</p>
<p>“It’s okay, baby. I’m going to get you out of here.”</p>
<p>She tried to move him, and he wouldn’t come. He was caught on
something. She pulled harder, and Terrie let out a scream that curdled
her blood, and blood poured down over both of them.</p>
<p>She looked back, and there was nothing to see. How could she ever
explain it? It was as if his arm was stuck in the darkness itself. Where
the bloody stump ended, there was only dark.</p>
<p>Then she heard the growl. The low warning of a dog standing over its
food.</p>
<p>She froze. Then she pulled, frantic, and kept pulling. Terrie’s
screams turned to grunts, and the grunts turned to silence.</p>
<p>That was when the mist cleared.</p>
</section>

  var src=document.getElementById('src').content;
  var epi=src.querySelector('.epigraph');
  var chapters=[].map.call(src.querySelectorAll('section.level2'),function(s,i){
    var h=s.querySelector('h2'); var t=h.textContent; var m=t.split(':');
    var body=s.cloneNode(true); body.querySelector('h2').remove();
    var words=body.textContent.trim().split(/\s+/).length;
    return {n:m[0].trim(),title:(m[1]||t).trim(),html:body.innerHTML,mins:Math.max(1,Math.round(words/230))};
  });
  var view=document.getElementById('view'), prog=document.getElementById('prog');
  function get(k,d){try{var v=localStorage.getItem('shuck-'+k);return v===null?d:v}catch(e){return d}}
  function put(k,v){try{localStorage.setItem('shuck-'+k,v)}catch(e){}}
  var size=parseFloat(get('size','1.22')), paper=get('paper','0')==='1', last=parseInt(get('last','0'),10)||0;
  function applyPrefs(){document.documentElement.style.setProperty('--size',size+'rem');document.body.classList.toggle('paper',paper);
    var b=document.getElementById('mode');b.textContent=paper?'☀':'☾';b.setAttribute('aria-label',paper?'Switch to night mode':'Switch to paper mode')}
  function start(){
    var items=chapters.map(function(c,i){return '<li class="'+(i===last&&get('begun','0')==='1'?'here':'')+'"><button data-ch="'+(i+1)+'"><span class="nn">'+(i+1)+'</span><span class="tt">'+c.title+'</span><span class="mm">'+c.mins+' min</span></button></li>'}).join('');
    var begun=get('begun','0')==='1';
    view.innerHTML='<div class="start"><img src="'+COVER+'" alt="Black Shuck cover: two red eyes in the fog above an empty road" width="640" height="1024"><div class="info"><h1>Black Shuck</h1><p class="by">AHMED K. BEY</p><p class="blurb">A couple on a nameless road. A wreck in the fog. And something with red eyes that will not stop running.</p><button class="go" data-ch="'+(begun?last+1:0)+'">'+(begun?'Continue: '+chapters[last].title:'Begin reading')+'</button><ol class="toc">'+items+'</ol></div></div>';
    prog.style.width='0';
  }
  function chap(i){
    var c=chapters[i]; last=i; put('last',i); put('begun','1');
    var prev=i>0?'<button data-ch="'+i+'"><b>Previous</b>'+chapters[i-1].title+'</button>':'<button data-ch="0"><b>Opening</b>The epigraph</button>';
    var next=i<chapters.length-1?'<button data-ch="'+(i+2)+'"><b>Next</b>'+chapters[i+1].title+'</button>':'';
    view.innerHTML='<article class="chap"><p class="kicker">Chapter '+c.n+'</p><h2>'+c.title+'</h2><div class="eyes" aria-hidden="true"><span></span><span></span></div>'+c.html+(i===chapters.length-1?'<p class="end">The story continues.</p>':'')+'<nav class="nav">'+prev+next+'</nav></article>';
    var p=view.querySelector('.chap > p:not(.kicker)'); if(p) p.classList.add('lead');
    window.scrollTo(0,0); onScroll();
  }
  function opening(){view.innerHTML='<article class="chap"><div class="epi">'+epi.innerHTML+'</div><nav class="nav"><button data-ch="1" style="margin-left:auto;text-align:right"><b>Begin</b>'+chapters[0].title+'</button></nav></article>';window.scrollTo(0,0);prog.style.width='0'}
  function route(){var m=location.hash.match(/^#ch-(\d+)$/);
    if(m){var n=parseInt(m[1],10);if(n>=1&&n<=chapters.length){chap(n-1);return}}
    if(location.hash==='#opening'){opening();return}
    start();}
  function go(n){var h=n===0?'#opening':'#ch-'+n; if(location.hash===h) route(); else location.hash=h}
  view.addEventListener('click',function(e){var b=e.target.closest('[data-ch]');if(b)go(parseInt(b.dataset.ch,10))});
  document.getElementById('home').onclick=function(){if(location.hash)location.hash='';else start(); window.scrollTo(0,0)};
  document.getElementById('bigger').onclick=function(){size=Math.min(1.8,+(size+0.08).toFixed(2));put('size',size);applyPrefs()};
  document.getElementById('smaller').onclick=function(){size=Math.max(0.95,+(size-0.08).toFixed(2));put('size',size);applyPrefs()};
  document.getElementById('mode').onclick=function(){paper=!paper;put('paper',paper?'1':'0');applyPrefs()};
  function onScroll(){if(!view.querySelector('.chap h2'))return;var h=document.documentElement.scrollHeight-innerHeight;prog.style.width=(h>0?Math.min(100,scrollY/h*100):100)+'%'}
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('hashchange',route);
  addEventListener('keydown',function(e){var m=location.hash.match(/^#ch-(\d+)$/);if(!m)return;var n=+m[1];
    if(e.key==='ArrowRight'&&n<chapters.length)go(n+1);if(e.key==='ArrowLeft'&&n>1)go(n-1)});
  applyPrefs(); route();
})();
